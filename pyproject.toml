[project]
name = "verne"
version = "0.5.0"
description = "Verne V0.5: an open-weight world action model for general-purpose robotics."
readme = "README.md"
license = { file = "LICENSE" }
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES"]
requires-python = ">=3.10"
dependencies = [
    "einops>=0.8",
    "ftfy>=6.2",
    "huggingface_hub>=0.34",
    "numpy>=1.26",
    "regex>=2024.9",
    "safetensors>=0.4",
    "torch>=2.5",
    "transformers>=4.44",
]

[dependency-groups]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/verne"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
extend-select = ["I", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
